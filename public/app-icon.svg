<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.4"/>
  
  <!-- Modern Geometric 'G' & Flag motif -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="32" stroke-dasharray="750 250" stroke-linecap="round" transform="rotate(-40 256 256)"/>
  
  <!-- Robot & Language Spark Symbol -->
  <path d="M 230 256 L 350 256" stroke="url(#accent)" stroke-width="32" stroke-linecap="round"/>
  <circle cx="256" cy="180" r="26" fill="#38bdf8"/>
  <circle cx="316" cy="180" r="18" fill="#818cf8"/>
  <circle cx="196" cy="180" r="18" fill="#06b6d4"/>

  <!-- Subtle German flag accent at bottom -->
  <rect x="180" y="370" width="50" height="12" rx="4" fill="#000000" stroke="#334155" stroke-width="1"/>
  <rect x="231" y="370" width="50" height="12" rx="4" fill="#DD0000"/>
  <rect x="282" y="370" width="50" height="12" rx="4" fill="#FFCE00"/>
</svg>
